<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - ShopEase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container" style="max-width: 420px; margin-top: 80px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h3 class="mb-4 text-center">Login to ShopEase</h3>

            <!-- Success flash message (e.g. after registration) -->
            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

            <!-- Error flash message (e.g. bad credentials) -->
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid email or password.
            </div>

            <!-- Logout flash message -->
            <div th:if="${param.logout}" class="alert alert-info">
                You have been logged out.
            </div>

            <form th:action="@{/login}" method="post">

                <div class="mb-3">
                    <label for="username" class="form-label">Email</label>
                    <input type="email" id="username" name="username"
                           class="form-control" required autofocus />
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-control" required />
                </div>

                <button type="submit" class="btn btn-primary w-100">Login</button>
            </form>

            <hr class="my-4">

            <p class="text-center mb-0">
                Don't have an account?
                <a th:href="@{/register}">Register here</a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
