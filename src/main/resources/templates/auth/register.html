<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - ShopEase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div class="container" style="max-width: 480px; margin-top: 60px;">
    <div class="card shadow-sm">
        <div class="card-body p-4">

            <h3 class="mb-4 text-center">Create your ShopEase account</h3>

            <form th:action="@{/register}" th:object="${registrationDto}" method="post">

                <!-- Global business error (e.g. duplicate email, password mismatch) -->
                <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger">
                    <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
                </div>

                <div class="mb-3">
                    <label for="fullName" class="form-label">Full name</label>
                    <input type="text" id="fullName" th:field="*{fullName}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" id="email" th:field="*{email}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}"
                         th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm password</label>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" class="form-control" />
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('confirmPassword')}"
                         th:errors="*{confirmPassword}"></div>
                </div>

                <button type="submit" class="btn btn-primary w-100">Register</button>
            </form>

            <hr class="my-4">

            <p class="text-center mb-0">
                Already have an account?
                <a th:href="@{/login}">Log in</a>
            </p>

        </div>
    </div>
</div>

</body>
</html>
