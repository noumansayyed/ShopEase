<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appName}">ShopEase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container text-center" style="margin-top: 80px;">
    <div th:replace="~{fragments/header :: navbar}"></div>
    <h1 th:text="'Welcome to ' + ${appName}">Welcome</h1>
    <p class="text-muted">Your e-commerce app is up and running.</p>

    <div class="mt-4">
        <a th:href="@{/login}" class="btn btn-primary me-2">Login</a>
        <a th:href="@{/register}" class="btn btn-outline-secondary">Register</a>
    </div>
</div>
</body>
</html>
