<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products - ShopEase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">

    <h2 class="mb-4">All Products</h2>

    <div class="alert alert-info" th:if="${products.isEmpty()}">
        No products available yet.
    </div>

    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">

                <a th:href="@{'/products/' + ${product.id}}">
                    <img th:src="${product.imageUrl}"
                         th:alt="${product.name}"
                         class="card-img-top"
                         style="height: 220px; object-fit: cover;" />
                </a>

                <div class="card-body d-flex flex-column">
                    <h6 class="card-title" th:text="${product.name}">Product name</h6>

                    <p class="text-muted small mb-2"
                       th:text="${product.category.name}">Category</p>

                    <p class="card-text small text-truncate"
                       th:text="${product.description}">Description</p>

                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fw-bold"
                              th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</span>

                        <a th:href="@{'/products/' + ${product.id}}"
                           class="btn btn-sm btn-outline-primary">View</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
