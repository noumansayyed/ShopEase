<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Products - ShopEase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">

    <h2 class="mb-4">Browse Products</h2>

    <!-- ===== Search + Category Filter Bar ===== -->
    <form method="get" th:action="@{/products}" class="row g-2 mb-4">

        <div class="col-md-6">
            <input type="text"
                   name="q"
                   class="form-control"
                   placeholder="Search products by name..."
                   th:value="${q}" />
        </div>

        <div class="col-md-4">
            <select name="category" class="form-select">
                <option value="" th:selected="${selectedCategory == ''}">All categories</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.slug}"
                        th:text="${cat.name}"
                        th:selected="${cat.slug == selectedCategory}">
                    Category name
                </option>
            </select>
        </div>

        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-primary flex-fill">Search</button>
            <a th:href="@{/products}" class="btn btn-outline-secondary">Reset</a>
        </div>
    </form>

    <!-- ===== Active filter feedback ===== -->
    <p class="text-muted small" th:if="${q != '' or selectedCategory != ''}">
        <span th:if="${q != ''}">
            Search: <strong th:text="${q}">keyword</strong>
        </span>
        <span th:if="${q != '' and selectedCategory != ''}"> &middot; </span>
        <span th:if="${selectedCategory != ''}">
            Category: <strong th:text="${selectedCategory}">slug</strong>
        </span>
        <span> — <span th:text="${products.size()}">0</span> result(s)</span>
    </p>

    <!-- ===== No results ===== -->
    <div class="alert alert-warning" th:if="${products.isEmpty()}">
        <strong>No products found.</strong>
        Try a different search or
        <a th:href="@{/products}">browse all products</a>.
    </div>

    <!-- ===== Product grid ===== -->
    <div class="row g-4">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card h-100 shadow-sm">

                <a th:href="@{'/products/' + ${product.id}}">
                    <img th:src="${product.imageUrl}"
                         th:alt="${product.name}"
                         class="card-img-top"
                         style="height: 220px; object-fit: cover;" />
                </a>

                <div class="card-body d-flex flex-column">
                    <h6 class="card-title" th:text="${product.name}">Product name</h6>

                    <p class="text-muted small mb-2"
                       th:text="${product.category.name}">Category</p>

                    <p class="card-text small text-truncate"
                       th:text="${product.description}">Description</p>

                    <div class="mt-auto d-flex justify-content-between align-items-center">
                        <span class="fw-bold"
                              th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</span>

                        <a th:href="@{'/products/' + ${product.id}}"
                           class="btn btn-sm btn-outline-primary">View</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
