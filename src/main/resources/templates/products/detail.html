<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${product.name} + ' - ShopEase'">Product - ShopEase</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

<div th:replace="~{fragments/header :: navbar}"></div>

<div class="container mt-4">

    <a th:href="@{/products}" class="btn btn-sm btn-outline-secondary mb-3">&larr; Back to products</a>

    <div class="row g-4">

        <div class="col-md-5">
            <img th:src="${product.imageUrl}"
                 th:alt="${product.name}"
                 class="img-fluid rounded shadow-sm" />
        </div>

        <div class="col-md-7">
            <p class="text-muted mb-1" th:text="${product.category.name}">Category</p>
            <h2 th:text="${product.name}">Product name</h2>

            <h3 class="text-primary my-3"
                th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$0.00</h3>

            <p th:text="${product.description}">Description</p>

            <p class="mt-3">
                <span th:if="${product.stockQuantity > 0}"
                      class="badge bg-success"
                      th:text="'In stock (' + ${product.stockQuantity} + ')'">In stock</span>
                <span th:if="${product.stockQuantity == 0}"
                      class="badge bg-danger">Out of stock</span>
            </p>

            <!-- Add-to-cart will be added in Step 9 -->
            <button class="btn btn-primary btn-lg mt-3" disabled>
                Add to cart (coming soon)
            </button>

        </div>
    </div>

</div>

</body>
</html>
